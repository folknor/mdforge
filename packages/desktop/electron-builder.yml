appId: com.mdforge.desktop
productName: mdforge
# electronVersion is left unset: electron-builder uses the installed Electron,
# so packaging matches dev.

# Without this fuse's extra file:// privileges, render pages (file://) follow
# Chrome's rules and their scripts cannot read other local files. The app page
# is served on its own scheme because of it (src/main/app-protocol.ts).
electronFuses:
  grantFileProtocolExtraPrivileges: false

directories:
  output: release
  buildResources: resources

# Disable auto-update publishing
publish: null

files:
  - out/**/*
  - "!node_modules/puppeteer/.local-chromium"

win:
  target:
    - target: portable
      arch: [x64]

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Utility

mac:
  target:
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.utilities

portable:
  artifactName: mdforge-${version}-portable.exe

appImage:
  artifactName: mdforge-${version}.AppImage
